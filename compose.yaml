services:
  postgres:
    image: postgres:17
    container_name: oficio24-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficio24
      POSTGRES_PASSWORD: oficio24_dev
      POSTGRES_DB: oficio24
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficio24 -d oficio24"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
